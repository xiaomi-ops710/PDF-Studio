<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fef7ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PDF Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
<link rel="stylesheet" href="style.css">
<title>PDF Studio</title>
</head>
<body data-tool="select" data-mode="v" data-hv="home" class="nodoc">

<main id="viewer"><div id="pages"></div></main>

<header id="bar">
  <div class="dg">
    <button class="ib" id="bHome" aria-label="ホーム"><i data-i="home"></i></button>
    <span class="vsep"></span>
    <button class="tabb" id="bTabEdit">編集</button>
    <button class="tabb" id="bTabExp">書き出し</button>
    <button class="tabb" id="bTabFill">入力と署名</button>
    <button class="tabb" id="bTabTools">その他のツール</button>
    <span class="grow"></span>
    <button class="ib" id="bUndo" aria-label="元に戻す"><i data-i="undo"></i></button>
    <button class="ib" id="bRedo" aria-label="やり直す"><i data-i="redo"></i></button>
    <span class="vsep"></span>
    <button class="ib" id="bSpeak" aria-label="読み上げ"><i data-i="volume_up"></i></button>
    <button class="ib" id="bSearch" aria-label="検索"><i data-i="search"></i></button>
    <button class="ib" id="bShare" aria-label="共有"><i data-i="ios_share"></i></button>
    <button class="ib" id="bMore" aria-label="その他"><i data-i="more_horiz"></i></button>
  </div>
  <div class="hg">
    <img class="blogo" src="icons/icon-192.png" alt="" width="40" height="40">
    <span class="grow"></span>
    <button class="ib" id="bSet" aria-label="設定"><i data-i="gear"></i></button>
  </div>
  <span id="title" hidden></span>
</header>

<div id="more" class="off">
  <div class="mh"><div class="mt"><b id="mName"></b><small id="mMeta"></small></div><button class="ib keep" id="mStar" aria-label="スター"><i data-i="star"></i></button></div>
  <button id="bRedo2"><i data-i="redo"></i>編集をやり直し</button>
  <button class="keep" id="mView"><i data-i="visibility"></i>表示設定<i class="chev" data-i="chevron_right"></i></button>
  <div id="mVw" class="keep" hidden>
    <div class="zrow keep"><button class="ib keep" id="zOut" aria-label="縮小"><i data-i="zout"></i></button><button class="keep" id="zLbl">100%</button><button class="ib keep" id="zIn" aria-label="拡大"><i data-i="zin"></i></button></div>
    <nav class="seg keep"><button class="keep" id="fW">幅に合わせる</button><button class="keep" id="fP">ページ全体</button></nav>
    <nav class="seg keep"><button class="keep" id="vC">連続</button><button class="keep" id="vD">見開き</button></nav>
    <button id="bInv"><i data-i="moon"></i>ページを反転</button>
    <button id="bFull"><i data-i="full"></i>全画面</button>
  </div>
  <hr>
  <button id="bRead"><i data-i="volume_up"></i>読み上げ</button>
  <button id="bOrg"><i data-i="org"></i>ページを整理</button>
  <button id="bCmp"><i data-i="compress"></i>PDFを圧縮</button>
  <button id="bMrg"><i data-i="merge"></i>ファイルを結合</button>
  <button id="bSpl"><i data-i="call_split"></i>PDFを分割</button>
  <button id="bInfo"><i data-i="info"></i>詳細情報</button>
  <hr>
  <button id="bSend"><i data-i="ios_share"></i>コピーを送信</button>
  <button id="bExp"><i data-i="dl"></i>コピーを保存</button>
  <button id="bPrint"><i data-i="print"></i>印刷</button>
  <hr>
  <button id="bOpen"><i data-i="up"></i>ファイルを開く</button>
  <button id="bSet2"><i data-i="gear"></i>設定</button>
</div>

<aside id="side">
  <div class="sh"><span>ページ・検索</span><button class="ib" id="sClose" aria-label="閉じる"><i data-i="close"></i></button></div>
  <div id="stabs"><button class="on" data-p="thumbs">ページ</button><button data-p="outl">しおり</button><button data-p="srch">検索</button><button data-p="cmt">コメント</button></div>
  <div id="thumbs"></div>
  <div id="outl" hidden></div>
  <div id="cmt" hidden></div>
  <div id="srch" hidden><input id="sq" type="search" placeholder="文字を検索（Enter）" enterkeyhint="search"><div id="sres"></div></div>
</aside>

<section id="home">
  <div class="hv hv-home"><h1 class="greet">ようこそ</h1><p class="gsub">次におこなう操作を選択してください。</p><div id="qt"></div></div>
  <div class="hv hv-files"><h1 class="greet">ファイル</h1></div>
  <label class="sbar hv hv-search"><i data-i="search"></i><input id="hq" type="search" placeholder="ファイル名で検索"></label>
  <nav class="htabs hv hv-home hv-files" id="htabs"><button class="on" data-t="recent">最近使用したファイル</button><button data-t="star">スター付き</button></nav>
  <div class="chips hv hv-files" id="hch"><button class="on" data-s="date">新しい順</button><button data-s="name">名前順</button><button data-s="size">サイズ順</button></div>
  <div id="recent"></div>
  <div class="drop">PDF・画像をここにドロップして開く</div>
</section>

<nav id="bnav">
  <button class="bi on" data-v="home"><i data-i="home"></i><span>ホーム</span></button>
  <button class="bi" data-v="files"><i data-i="folder"></i><span>ファイル</span></button>
  <button class="bi" data-v="search"><i data-i="search"></i><span>検索</span></button>
  <button class="bi" data-v="tools"><i data-i="apps"></i><span>ツール</span></button>
</nav>
<button id="fab" aria-label="新規・開く"><i data-i="plus"></i></button>
<div id="fabm" class="off">
  <button data-f="pdf"><i data-i="pages"></i>PDFを開く</button>
  <button data-f="img"><i data-i="photo"></i>画像からPDFを作成</button>
  <button data-f="cam"><i data-i="cam"></i>写真を撮ってPDFに</button>
</div>

<nav id="rtool">
  <button class="ib" id="bCmt" aria-label="コメント"><i data-i="comment"></i></button>
  <button class="ib" id="bSide" aria-label="ページ一覧"><i data-i="grid"></i></button>
</nav>
<div id="nav">
  <button class="ib" id="pPrev" aria-label="前のページ"><i data-i="up2"></i></button>
  <button class="ib" id="pNext" aria-label="次のページ"><i data-i="dn2"></i></button>
  <input id="pNum" type="number" inputmode="numeric" min="1" value="1"><span id="pTot">1</span>
</div>

<div id="props" class="off">
  <nav id="shp" class="seg" style="display:none"><button data-k="line">線</button><button data-k="arrow">矢印</button><button data-k="rect" class="on">四角</button><button data-k="ell">楕円</button></nav>
  <div id="sw"></div>
  <label class="row"><span id="szL">太さ</span><input id="sz" type="range" min="1" max="14" step="1"><output id="szV"></output></label>
  <label class="row"><span>指でも描く</span><input id="finger" type="checkbox" class="switch"></label>
</div>

<nav id="dock">
  <button class="tool on" data-t="select" aria-label="選択"><i data-i="cur"></i></button>
  <button class="tool" data-t="note" aria-label="付箋コメント"><i data-i="note"></i></button>
  <button class="tool" data-t="hlt" aria-label="ハイライト"><i data-i="hlt"></i></button>
  <button class="tool" data-t="ult" aria-label="下線"><i data-i="ult"></i></button>
  <button class="tool" data-t="stt" aria-label="取り消し線"><i data-i="stt"></i></button>
  <button class="tool" data-t="pen" aria-label="描画"><i data-i="pen"></i></button>
  <button class="tool" data-t="hl" aria-label="蛍光ペン"><i data-i="hl"></i></button>
  <button class="tool" data-t="shape" aria-label="図形"><i data-i="shape"></i></button>
  <button class="tool" data-t="text" aria-label="テキストを追加"><i data-i="text"></i></button>
  <button class="tool" data-t="er" aria-label="消しゴム"><i data-i="er"></i></button>
  <span class="sep"></span>
  <button class="tool" id="bFill" aria-label="入力と署名"><i data-i="sign"></i><span class="tri"></span></button>
</nav>

<div id="rdbar"><i data-i="volume_up"></i><span>読み上げ中</span><button id="rdStop">停止</button></div>

<section id="org">
  <header class="obar">
    <button class="ib" id="oClose" aria-label="閉じる"><i data-i="close"></i></button>
    <div id="oTitle">ページを整理</div>
    <button class="fabx" id="oApply"><i data-i="check"></i>適用</button>
  </header>
  <div id="ochips">
    <button data-a="all"><i data-i="check"></i>全選択</button>
    <button data-a="rl"><i data-i="rotl"></i>左回転</button>
    <button data-a="rr"><i data-i="rotr"></i>右回転</button>
    <button data-a="l"><i data-i="left"></i>前へ</button>
    <button data-a="r"><i data-i="right"></i>後ろへ</button>
    <button data-a="dup"><i data-i="copy"></i>複製</button>
    <button data-a="del"><i data-i="trash"></i>削除</button>
    <button data-a="blank"><i data-i="plus"></i>白紙を追加</button>
    <button data-a="merge"><i data-i="merge"></i>PDF・画像を挿入</button>
    <button data-a="ext"><i data-i="dl"></i>選択を書き出し</button>
  </div>
  <div id="ogrid"></div>
</section>

<section id="tools">
  <header class="obar"><button class="ib" id="tClose" aria-label="閉じる"><i data-i="close"></i></button><div style="flex:1;font-size:22px;font-weight:700">ツール</div></header>
  <div id="tgrid"></div>
</section>

<button id="exit" aria-label="全画面を終了"><i data-i="close"></i></button>
<dialog id="info"></dialog>
<dialog id="set"></dialog>
<dialog id="sig"></dialog>
<dialog id="stamps"></dialog>
<dialog id="opt"></dialog>
<div id="busy"><div class="bx"><div class="ld"></div><div id="busyT"></div><div class="lp" style="width:150px"><i class="lpf" style="width:100%"></i></div></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/pdf,.pdf,image/*" hidden>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileG" accept="image/*" hidden>
<input type="file" id="fileM" accept="application/pdf,.pdf,image/*" multiple hidden>
<input type="file" id="file2" accept="application/pdf,.pdf,image/*" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="app.js"></script>
</body>
</html>
